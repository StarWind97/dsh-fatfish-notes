<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>肥鱼笔记 · 图标配色实验</title><link id="favicon" rel="icon"><style>body{margin:60px;font:16px 'Microsoft YaHei',sans-serif;background:#f5f6f1;color:#25382e}img{width:128px;height:128px}p{max-width:640px;line-height:1.8}</style><body><h1>肥鱼笔记 · 任务栏配色实验</h1><img id="tile" alt="图标"><h2 id="name"></h2><p>这是项目测试资料启动的临时预览窗口，仅用于拍摄任务栏候选。没有连接日常 DSH 数据。</p><script type="module">const {families}=await fetch('catalog.json').then(r=>r.json());const id=new URLSearchParams(location.search).get('family');const f=families.find(x=>x.id===id);if(!f)throw Error('Unknown family');document.querySelector('#favicon').href=`assets/${id}-tile.ico`;document.querySelector('#tile').src=`assets/${id}-tile.svg`;document.querySelector('#name').textContent=f.name;document.title='肥鱼笔记 · '+f.name+' · 图标实验';document.body.dataset.ready='true';</script></body></html>
