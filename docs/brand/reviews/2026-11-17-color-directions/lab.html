<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>肥鱼 · 配色实验</title><style>body{font:17px/1.7 system-ui;background:#f8faf6;color:#243a2d;padding:40px;max-width:760px;margin:auto}img{width:128px;height:128px}</style></head><body><img id="icon" alt="候选图标"><h1>肥鱼笔记 · 任务栏配色实验</h1><p id="name"></p><p>仅用于本轮真实任务栏截图。没有笔记内容，不修改正式插件。</p><script>
(async()=>{const c=await(await fetch('catalog.json')).json(),q=new URLSearchParams(location.search),p=c.palettes.find(p=>p.id===q.get('color')),g=c.geometries.find(g=>g.id===(q.get('shape')||'base'));if(!p||!g)throw Error('Unknown candidate');const base=`assets/${p.id}-${g.id}-tile`;document.title='肥鱼配色实验 · '+p.name+' · '+g.name;const link=document.createElement('link');link.rel='icon';link.href=base+'.ico';document.head.append(link);document.querySelector('#icon').src=base+'-128.png';document.querySelector('#name').textContent=p.name+' / '+g.name;document.body.dataset.ready='true'})();
</script></body></html>
